[project]
name = "flutter-agent-framework"
version = "0.1.0"
description = "Provider-agnostic governed coding agent framework for Flutter projects."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
documents = ["pypdf>=5,<6", "pdf2image>=1.17,<2", "pytesseract>=0.3.13,<1"]

[project.scripts]
flutter-agent = "flutter_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

